name: Terraform Scan, Plan & Apply

on:

  # ==========================================================
  # FEATURE BRANCH
  # ==========================================================

  push:
    branches:
      - "feature/**"

  # ==========================================================
  # PULL REQUEST TO MAIN
  # ==========================================================

  pull_request:
    branches:
      - main

  # ==========================================================
  # MANUAL RUN
  # ==========================================================

  workflow_dispatch:


# ============================================================
# GITHUB ACTIONS PERMISSIONS
# ============================================================

permissions:
  contents: read
  id-token: write


# ============================================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================================

env:
  TF_WORKING_DIR: Environments/Parent_Modules/DEV


jobs:

  # ==========================================================
  # JOB 1 — TERRAFORM SCAN
  # ==========================================================

  terraform-scan:

    name: Terraform Scan
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # SETUP TERRAFORM
      # ======================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ======================================================
      # TERRAFORM VERSION
      # ======================================================

      - name: Terraform Version
        run: terraform version


      # ======================================================
      # CHECK TERRAFORM DIRECTORY
      # ======================================================

      - name: Check Terraform Directory
        run: |
          echo "Terraform Working Directory:"
          echo "${{ env.TF_WORKING_DIR }}"

          echo ""
          echo "Files inside Terraform directory:"
          ls -la "${{ env.TF_WORKING_DIR }}"

          echo ""
          echo "Terraform files:"
          find "${{ env.TF_WORKING_DIR }}" \
            -maxdepth 1 \
            -type f \
            -name "*.tf" \
            -print


      # ======================================================
      # TERRAFORM INIT
      # ======================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false


      # ======================================================
      # TERRAFORM FORMAT
      # ======================================================

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive


      # ======================================================
      # TERRAFORM VALIDATE
      # ======================================================

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


  # ==========================================================
  # JOB 2 — TERRAFORM PLAN
  # ==========================================================

  terraform-plan:

    name: Terraform Plan
    runs-on: ubuntu-latest

    needs: terraform-scan

    # Plan:
    # Feature branch push
    # Pull request
    # Manual workflow
    # ======================================================

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # SETUP TERRAFORM
      # ======================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ======================================================
      # TERRAFORM VERSION
      # ======================================================

      - name: Terraform Version
        run: terraform version


      # ======================================================
      # TERRAFORM INIT
      # ======================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false


      # ======================================================
      # AZURE LOGIN
      # ======================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ======================================================
      # TERRAFORM PLAN
      # ======================================================

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="Terraform.tfvars" \
            -input=false \
            -out=tfplan


      # ======================================================
      # VERIFY TERRAFORM PLAN
      # ======================================================

      - name: Verify Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Checking tfplan..."

          test -f tfplan

          echo ""
          echo "tfplan exists successfully."


      # ======================================================
      # UPLOAD TERRAFORM PLAN
      # ======================================================

      - name: Upload Terraform Plan
        if: |
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/heads/feature/')
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1


  # ==========================================================
  # JOB 3 — TERRAFORM APPLY
  # ==========================================================

  terraform-apply:

    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # ======================================================
    # APPLY ONLY ON FEATURE BRANCH PUSH
    # PR → MAIN WILL NOT APPLY
    # ======================================================

    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/feature/')


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # SETUP TERRAFORM
      # ======================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ======================================================
      # TERRAFORM VERSION
      # ======================================================

      - name: Terraform Version
        run: terraform version


      # ======================================================
      # TERRAFORM INIT
      # ======================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false


      # ======================================================
      # AZURE LOGIN
      # ======================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ======================================================
      # DOWNLOAD TERRAFORM PLAN
      # ======================================================

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}


      # ======================================================
      # VERIFY TERRAFORM PLAN
      # ======================================================

      - name: Verify Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Checking tfplan..."

          test -f tfplan

          echo ""
          echo "tfplan found successfully."


      # ======================================================
      # TERRAFORM APPLY
      # ======================================================

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan